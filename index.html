<!doctype html>
<html lang="ms">
  <head>
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var str = Array.prototype.map.call(arguments, function(a) {
            return (a && a.message) || String(a);
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('vite') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (e && (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('vite') !== -1))) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e && e.reason;
          var msg = (r && r.message) || String(r);
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        var OrigWS = window.WebSocket;
        if (!OrigWS) return;
        window.WebSocket = function(url, protocols) {
          var isVite = (typeof protocols === 'string' && protocols.indexOf('vite') !== -1) ||
            (Array.isArray(protocols) && protocols.some(function(p) { return p.indexOf('vite') !== -1; })) ||
            (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('24678') !== -1));
          if (isVite) {
            var et = new EventTarget();
            var ws = {
              url: url,
              readyState: 1,
              bufferedAmount: 0,
              extensions: '',
              protocol: typeof protocols === 'string' ? protocols : (protocols && protocols[0]) || '',
              binaryType: 'blob',
              addEventListener: et.addEventListener.bind(et),
              removeEventListener: et.removeEventListener.bind(et),
              dispatchEvent: et.dispatchEvent.bind(et),
              send: function() {},
              close: function() {
                ws.readyState = 3;
                et.dispatchEvent(new Event('close'));
              },
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null
            };
            setTimeout(function() {
              ws.readyState = 1;
              var ev = new Event('open');
              et.dispatchEvent(ev);
              if (typeof ws.onopen === 'function') ws.onopen(ev);
            }, 5);
            return ws;
          }
          return new OrigWS(url, protocols);
        };
        window.WebSocket.prototype = OrigWS.prototype;
        window.WebSocket.CONNECTING = 0;
        window.WebSocket.OPEN = 1;
        window.WebSocket.CLOSING = 2;
        window.WebSocket.CLOSED = 3;
      })();
    </script>
